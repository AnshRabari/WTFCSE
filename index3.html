<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Bank Portal</title>
    <link rel="stylesheet" href="style3.css">
    <script src="script.js"></script>
  
</head>
<body>

    <header>
        <table>
            <td><img src="logo2.jpg" alt="Secure Bank Logo" width="150"></td>
            <td>Secure Bank Of World Portal</td>
        </table>

    </header>
    <hr>
    <hr>

    <section>
        <h3>Eligibilty Criteria Test</h3>
        <label>Age:</label>
        <input id="age" type="number">
        <br>
        <br>
        <label>Monthly Salary:</label>
        <input type="number" id="salary">
        <br>
        <br>
        <button onclick="checkLoanEligibility()">Check Eligibility</button>
        <p id="ele"></p>
    </section>
<hr>
<hr>

    <section>
        <h3>EMI Calculator</h3>
        <label >Loan Amouunt:</label>
        <input type="text" id="loanAmount" >
        <br>
        <br>
        <label >Interest Rate(%):</label>
        <input type="text" id="InterestRate">
        <br>
        <br>
        <label >Years:</label>(%):</label>
        <input type="text" id="Years">
        <br>
        <br>
        <button onclick="CalculateEMI()">Calculate EMI</button>
        <p id="EMIResult"></p>
    </section>

<hr>
<hr>
    <section>
        <h3>Simple Interest Calculator</h3>
        <label >Principle Amount:</label>
        <input id="Principle Amount" type="text">
        <br>
        <br>
        <label >Rate:</label>
        <input id="Rate" type="text">
        <br>
        <br>
        <label >Time(in years):</label>
        <input id="Time" type="text">
        <br>
        <br>
        <button onclick="CalculateSI()">Calculate Interest</button>
        <p id="siResult"></p>
    </section>

<hr>
<hr>

    <section>

        <h3>Account Type</h3>

        <select id="AccountType">
            <option>Select Type</option>
            <option>Savings</option>
            <option>Current</option>
            <option>Fixed Deposit</option>
        </select>
    </section>
    <section>
    <button onclick="DisplayAccountType()">
        Show Details
    </button>

    <p id="AccountTypeResult"></p>
    </section>

    <hr>
    <hr>

    <section>
        <h3>Interest Table(Loop)</h3>

        <button onclick="GenerateInterestTable()">
            Generate Table
        </button>

        <pre id="tableResult"></pre>
    </section>

   

<hr>
<hr>
    <footer>
    <p>&copy; Secure Bank Of World</p> 
    <a href="#">Facebook</a>|
    <a href="#">Instagram</a>|
    <a href="#">LinkedIn</a>
    </footer>
    
</body>
</html>
